name: skill-repo-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验技能结构与引用
        run: node scripts/install.mjs --validate

      - name: 安装到临时目录并抽查
        run: |
          node scripts/install.mjs --dest "$RUNNER_TEMP/skills-out"
          ls -1 "$RUNNER_TEMP/skills-out"
